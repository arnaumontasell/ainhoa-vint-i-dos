 }
 if(stage==='activities'){
  mount(`<section class="center"><p class="eyebrow">Els regals tenen una condició…</p><h2>Primer, una aventura.<br><em>I després, els regals.</em></h2><p class="muted">Per obrir-los, has de triar un d’aquests plans per fer junts. La data i el lloc els decidirem entre tots dos.</p><div class="activities">${activities.map(a=>`<button class="activity ${activityChoice===a.id?'chosen':''}" data-activity="${a.id}" aria-pressed="${activityChoice===a.id}" ><span class="activity-icon" aria-hidden="true">${a.icon}</span><span><strong>${a.title}</strong><span>${a.description}</span></span></button>`).join('')}</div><p role="status" class="choice-status">${activityChoice?'Pla escollit: '+activities.find(a=>a.id===activityChoice).title:'Tria el pla que et faci més il·lusió.'}</p><button class="primary" data-action="accept-activity" ${activityChoice?'':'disabled'}>Accepto el repte. Obrim els regals!</button><div class="bottom"><button class="secondary" data-action="decline-activity">No en trio cap</button></div></section>`);return;
 }
 if(stage==='christmas-tease'){
  mount(`<section class="center"><p class="eyebrow">Sabia que aquesta et faria gràcia…</p><div class="reveal-icon" aria-hidden="true">🎄</div><h2>Ja t’hi veies,<br><em>eh, princesa?</em></h2><p class="message">Jajaja! Què et penses, que et deixaré escapar sense triar una de les altres dues aventures? Tira, va! 😏</p><p class="muted">Torna als plans i tria: neu i esquís, o un cim junts.</p><button class="primary" data-action="back-activities">Va, tornem a les aventures</button></section>`);return;
 }
 if(stage==='declined'){
  mount(`<section class="center"><p class="eyebrow">Els regals es queden tancats</p><h2>Sense aventura,<br><em>no hi ha contrasenya.</em></h2><p class="muted">D’acord, avui no escollim cap pla. Els regals es queden guardats. Si canvies d’idea, pots tornar a mirar les activitats.</p><button class="primary" data-action="back-activities">Tornar a les activitats</button><div class="bottom"><button class="secondary" data-action="review">Tornar als nostres records</button></div></section>`);return;
 }
 if(stage==='gifts'){
  mount(`<section class="center"><p class="eyebrow">Ara sí, els teus regals</p><h2>Tres regals.<br><em>Dues sorpreses per a tu.</em></h2><p class="muted">Tria’n un i descobreix què amaga. Després podràs escollir el següent.</p><div class="gifts">${giftOrder.map((_,i)=>`<button class="gift" data-gift="${i}" aria-label="${opened.includes(i)?'Regal '+(i+1)+' ja obert':'Obrir regal '+(i+1)}" ${opened.includes(i)?'disabled':''}><span class="gift-symbol" aria-hidden="true">${opened.includes(i)?'✧':'🎁'}</span><span class="gift-label">Regal ${i+1}</span>${opened.includes(i)?'<span class="gift-open">Ja obert</span>':''}</button>`).join('')}</div><p class="count">${rewardCount()} de 2 regals descoberts</p></section>`);return;
 }
 if(stage==='gift'){
  const kind=giftOrder[selected];
  if(kind==='joke'){mount(`<section class="reveal reveal-postcard"><p class="eyebrow">Aquest portava trampa</p><h2>El regal és una postal d'una noia i un noi molt guapos.<br></h2>${picture(funnyPhoto,'☺')}<p class="message">Buenoo.. En pots triar un altre ${2-rewardCount()===2?'dos regals'}.</p><button class="primary" data-action="continue">Tornar a escollir</button></section>`);return}
  const secret=kind==='secret';mount(`<section class="reveal"><p class="eyebrow">Regal ${rewardCount()} de 2</p><div class="reveal-icon" aria-hidden="true">${secret?'🎁':'🥂'}</div><h2>${secret?'La sorpresa<br><em>va dins del paquet.</em>':'Posa’t guapa.<br><em>Tenim una cita.</em>'}</h2><p class="message">${secret?'Aquest regal no es pot obrir amb un clic. T’espera fora de la pantalla… i, si tens curiositat, et puc donar una pista.':'Reserva’m una nit i posa’t guapa, que tenim una cita. Tapetes, pizza o pasta, o sushi: què et ve més de gust? El lloc concret el triarem entre tots dos. ♥'}</p>${secret?`<div class="hint-box"><p id="hint-text" role="status">${hintLevel?materialHints[hintLevel-1]:'El pots deixar en misteri… o tafanejar una mica.'}</p><button class="secondary" data-action="hint" ${hintLevel===materialHints.length?'disabled':''}>${hintLevel===0?'Vull una pista':'Ja tens la pista'}</button></div><p class="muted">Per descobrir-ho de veritat, mira’m i demana’m el teu regal.</p>`:`<div class="dinner-options" role="group" aria-label="Què sopem?">${dinnerOptions.map(d=>`<button class="dinner-option ${dinnerChoice===d.id?'chosen':''}" data-dinner="${d.id}" aria-pressed="${dinnerChoice===d.id}"><span aria-hidden="true">${d.icon}</span>${d.label}</button>`).join('')}</div><p class="choice-status" id="dinner-status" role="status">${dinnerChoice?'Em quedo amb '+dinnerOptions.find(d=>d.id===dinnerChoice).label.toLowerCase()+'. El restaurant, el triem junts.':'Pots triar ara o decidir-ho junts més endavant.'}</p>`}<button class="primary" data-action="continue">${rewardCount()===2?'Els meus dos regals':'Escollir el següent regal'}</button></section>`);return;
 }
 mount(`<section class="center"><p class="eyebrow">Tots dos són per a tu</p><h2>Feliços 22,<br><em>Ainhoa.</em></h2><p class="muted">Quatre anys i escaig de nosaltres. I encara tantes coses per viure.</p><div class="reward-list"><div class="reward"><span aria-hidden="true">🤫</span><p>Un paquet amb sorpresa<small>El secret es descobreix fora de la pantalla.</small></p></div><div class="reward"><span aria-hidden="true">🥂</span><p>Una cita per a dos<small>${dinnerChoice?safe(dinnerOptions.find(d=>d.id===dinnerChoice).label)+' · Restaurant per triar junts.':'Tapetes, pizza o pasta, o sushi. Ho triarem junts.'}</small></p></div></div><p class="accepted-plan">La nostra propera aventura: <strong>${safe(activities.find(a=>a.id===acceptedActivity)?.title||'')}</strong></p><p>T’estimo. I em fa molta il·lusió seguir sumant amb tu. ♥</p><button class="secondary" data-action="review">Tornar a veure els records</button></section>`);
}
function moveNo(){if(stage!=='question'||locked)return;const b=app.querySelector('[data-action="no"]');const [x,y]=noPositions[noMoves%noPositions.length];b.style.left=x+'%';b.style.top=y+'%';document.getElementById('feedback').textContent=noMessages[noMoves%noMessages.length];noMoves++}
function tapHeart(){if(stage!=='question'||locked)return;heartCount++;const progress=document.getElementById('heart-progress');progress.setAttribute('aria-valuenow',String(heartCount));[...progress.children].forEach((el,i)=>el.classList.toggle('filled',i<heartCount));app.querySelector('.yes-symbol').style.setProperty('--heart-scale',String(1+heartCount*.045));document.getElementById('feedback').textContent=heartMessages[heartCount-1];if(heartCount===heartTarget){locked=true;app.querySelector('[data-action="heart"]').disabled=true;const id=runId;setTimeout(()=>{if(id!==runId)return;stage='album';locked=false;render()},850)}}
function openGift(index){if(stage!=='gifts'||!acceptedActivity||!Number.isInteger(index)||index<0||index>=giftOrder.length||opened.includes(index)||rewardCount()>=2)return false;opened.push(index);selected=index;hintLevel=0;stage='gift';render();return true}
function continueGift(){if(stage!=='gift')return;stage=rewardCount()===2?'finish':'gifts';render()}
function chooseActivity(id){if(stage!=='activities')return false;const activity=activities.find(a=>a.id===id);if(!activity)return false;if(activity.teaser){activityChoice=null;acceptedActivity=null;stage='christmas-tease';render();return true}const scrollPosition=window.scrollY;activityChoice=id;render();window.scrollTo({top:scrollPosition,behavior:'instant'});const b=app.querySelector(`[data-activity="${id}"]`);if(b)b.focus({preventScroll:true});return true}
function acceptActivity(){if(stage!=='activities'||!activities.some(a=>a.id===activityChoice&&!a.teaser))return false;acceptedActivity=activityChoice;stage='gifts';render();return true}
function showHint(){if(stage!=='gift'||giftOrder[selected]!=='secret'||hintLevel>=materialHints.length)return false;hintLevel++;document.getElementById('hint-text').textContent=materialHints[hintLevel-1];const b=app.querySelector('[data-action="hint"]');b.textContent='Ja tens la pista';b.disabled=hintLevel===materialHints.length;return true}
function chooseDinner(id){if(stage!=='gift'||giftOrder[selected]!=='dinner'||!dinnerOptions.some(d=>d.id===id))return false;dinnerChoice=id;app.querySelectorAll('[data-dinner]').forEach(b=>{const active=b.dataset.dinner===id;b.setAttribute('aria-pressed',String(active));b.classList.toggle('chosen',active)});document.getElementById('dinner-status').textContent='Em quedo amb '+dinnerOptions.find(d=>d.id===id).label.toLowerCase()+'. El restaurant, el triem junts.';return true}
function restart(){runId++;dinnerChoice=null;activityChoice=null;acceptedActivity=null;hintLevel=0;stage='question';heartCount=0;slide=0;opened=[];selected=null;locked=false;noMoves=0;giftOrder=shuffle(['joke','secret','dinner']);render()}
// Si falten les versions optimitzades, mostra la foto original pujada a GitHub.
app.addEventListener('error',event=>{
 const img=event.target;
 if(img.tagName!=='IMG'||!img.dataset.original||img.dataset.fallbackUsed)return;
 img.dataset.fallbackUsed='true';
 img.removeAttribute('srcset');
 img.removeAttribute('sizes');
 img.src=img.dataset.original;
},true);
app.addEventListener('pointerdown',e=>{if(e.target.closest('[data-action="no"]')){e.preventDefault();moveNo()}});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;if(a==='no'){e.preventDefault();if(e.detail===0)moveNo();return}if(a==='heart')return tapHeart();if(a==='previous'&&stage==='album'&&slide>0){slide--;render();return}if(a==='next'&&stage==='album'){if(slide<memories.length-1)slide++;else stage=rewardCount()===2?'finish':acceptedActivity?'gifts':'activities';render();return}if(a==='review'&&(stage==='finish'||stage==='declined')){slide=0;stage='album';render();return}if(a==='continue')return continueGift();if(b.dataset.activity)return chooseActivity(b.dataset.activity);if(a==='accept-activity')return acceptActivity();if(a==='decline-activity'&&stage==='activities'){activityChoice=null;acceptedActivity=null;stage='declined';render();return}if(a==='back-activities'&&(stage==='declined'||stage==='christmas-tease')){stage='activities';render();return}if(a==='hint')return showHint();if(b.dataset.dinner)return chooseDinner(b.dataset.dinner);if(b.dataset.gift!==undefined)openGift(Number(b.dataset.gift))});
render();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'start_birthday_adventure',title:'Tornar al començament',description:'Reinicia l’aventura de l’Ainhoa, inclosos els cors, els records i els regals oberts.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||typeof input!=='object'||Array.isArray(input)||Object.keys(input).length)throw new Error('No s’esperen paràmetres');restart();return{stage,heartCount,rewards:rewardCount()}}})).catch(()=>{})}catch{}}
</script>
</body></html>
